[package]
name = "khaopiyo"
version = "1.0.0"
description = "KhaoPiyo — Restaurant OS desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bluetooth and USB thermal printers reach Windows as a COM port; this is how
# ESC/POS bytes get to one without a printer driver in the way.
serialport = "4"

[[bin]]
name = "khaopiyo"
path = "src/main.rs"
