[package]
name = "khaopiyo"
version = "1.1.0"
description = "KhaoPiyo — Restaurant OS desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# Only one copy of the app may run: two processes fight over the WebView2
# profile lock and neither persists cookies, which is why the login never
# stuck.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bluetooth and USB thermal printers reach Windows as a COM port; this is how
# ESC/POS bytes get to one without a printer driver in the way.
serialport = "4"
# The print bridge's HTTP client. rustls instead of the platform TLS stack so
# the build never needs a system OpenSSL toolchain.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# IANA-tzdata-aware timestamp formatting for the bridge's ticket headers.
# chrono-tz compiles the zone database in, so this never needs a runtime
# download the way some OS tzdata packages do.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Tauri already runs on tokio (tauri::async_runtime::spawn is built on it),
# but that doesn't make the `tokio` crate name usable here — Cargo only
# exposes crates listed as direct dependencies. Only the `time` feature is
# needed: the bridge loop's poll interval.
tokio = { version = "1", features = ["time"] }

[[bin]]
name = "khaopiyo"
path = "src/main.rs"
