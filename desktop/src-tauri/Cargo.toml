[package]
name = "khaopiyo"
version = "1.2.1"
description = "KhaoPiyo — Restaurant OS desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon" is off by default and is what makes `tauri::tray` compile at all.
# Without a tray there is nowhere for the window to go when someone closes it,
# so closing would have to keep meaning "quit" — and quitting takes the print
# bridge, and therefore the kitchen tickets, with it.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# The webview is sandboxed and drops target="_blank" links (View/Print bill)
# on the floor with no error — this plugin is what makes it hand them to the
# system's default browser instead. Also needs opener:default in capabilities.
tauri-plugin-opener = "2"
# A native toast after a silent background update completes — visible, but
# never blocks or interrupts the till the way a confirm-before-updating
# prompt would.
tauri-plugin-notification = "2"
# Only one copy of the app may run: two processes fight over the WebView2
# profile lock and neither persists cookies, which is why the login never
# stuck.
tauri-plugin-single-instance = "2"
# A till PC that reboots — power cut, overnight Windows update, staff switching
# it off at closing — comes back with nothing running, and the half nobody
# notices is that the print bridge is gone with it: kitchen tickets stop
# silently, with no error anywhere, until someone eventually remembers the app
# has to be opened by hand. This registers the app with Windows startup so that
# never has to be remembered. Driven entirely from Rust — the website never
# calls it — so it deliberately gets no entry in capabilities/default.json.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bluetooth and USB thermal printers reach Windows as a COM port; this is how
# ESC/POS bytes get to one without a printer driver in the way.
serialport = "4"
# The print bridge's HTTP client. rustls instead of the platform TLS stack so
# the build never needs a system OpenSSL toolchain.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# IANA-tzdata-aware timestamp formatting for the bridge's ticket headers.
# chrono-tz compiles the zone database in, so this never needs a runtime
# download the way some OS tzdata packages do.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Tauri already runs on tokio (tauri::async_runtime::spawn is built on it),
# but that doesn't make the `tokio` crate name usable here — Cargo only
# exposes crates listed as direct dependencies. Only the `time` feature is
# needed: the bridge loop's poll interval.
tokio = { version = "1", features = ["time"] }
# Raw print-spooler access (winspool.rs) — sends ESC/POS bytes straight to a
# named Windows printer queue, RAW datatype, no dialog. Pinned to the same
# 0.61 line already resolved transitively by wry/webview2-com so this adds
# no new major version to the dependency tree.
windows = { version = "0.61", features = ["Win32_Graphics_Printing", "Win32_Foundation"] }

[[bin]]
name = "khaopiyo"
path = "src/main.rs"
