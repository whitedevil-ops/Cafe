name: Release desktop app

# Cuts a real GitHub Release containing the Windows installer plus
# latest.json — the file the app's updater polls. Without this workflow the
# updater has nothing to find, which is why it never worked before.
#
# Windows only. This used to also build a macOS leg via a matrix, but every
# café running this app runs it on Windows — the macOS build had never once
# succeeded, and because a matrix run is marked "Failure" overall if any leg
# fails, it was making a run where the Windows build (the only one anyone
# needs) built and published fine show up as a red X in the Actions list.
# Confusing to read, no upside. Revisit if a café ever actually shows up on
# a Mac.
#
# Triggered by pushing a tag like `desktop-v1.0.1`. Tags rather than every
# push, because the desktop shell is a thin window over the live site: web
# changes reach every café instantly and need no release at all. Only changes
# under desktop/src-tauri are worth shipping this way.
#
# Before the first run, two repository secrets must exist:
#   TAURI_SIGNING_PRIVATE_KEY           — from `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — the passphrase for that key ('' if none)
# The matching public key already lives in tauri.conf.json. If they do not
# match, every café's updater will reject the download as unsigned.
#
# See docs/desktop-releases.md.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Builds, signs the updater artifacts, and creates/updates one draft
      # release with the Windows installer and latest.json.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseName: 'KhaoPiyo Desktop __VERSION__'
          releaseBody: |
            Download the `.msi` below and run it.

            Existing installs update themselves the next time they are opened —
            no need to download anything.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
