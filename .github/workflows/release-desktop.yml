name: Release desktop app

# Cuts a real GitHub Release containing the Windows installer plus
# latest.json — the file the app's updater polls. Without this workflow the
# updater has nothing to find, which is why it never worked before.
#
# Windows only. This used to also build a macOS leg via a matrix, but every
# café running this app runs it on Windows — the macOS build had never once
# succeeded, and because a matrix run is marked "Failure" overall if any leg
# fails, it was making a run where the Windows build (the only one anyone
# needs) built and published fine show up as a red X in the Actions list.
# Confusing to read, no upside. Revisit if a café ever actually shows up on
# a Mac.
#
# Triggered by pushing a tag like `desktop-v1.0.1`. Tags rather than every
# push, because the desktop shell is a thin window over the live site: web
# changes reach every café instantly and need no release at all. Only changes
# under desktop/src-tauri are worth shipping this way.
#
# Releases publish themselves — there is no draft and no button to press. The
# old manual publish step stranded v1.1.8 for hours while every café went
# without a print-bridge fix. What gates a build now is the shape of the tag,
# not somebody remembering: see the channel step below.
#
# Before the first run, two repository secrets must exist:
#   TAURI_SIGNING_PRIVATE_KEY           — from `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — the passphrase for that key ('' if none)
# The matching public key already lives in tauri.conf.json. If they do not
# match, every café's updater will reject the download as unsigned.
#
# See docs/desktop-releases.md.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Decides whether this build reaches cafés, so that nobody has to.
      #
      # The updater polls releases/latest/download/latest.json, and GitHub
      # resolves "latest" to the newest release that is neither a draft nor a
      # pre-release. So marking a build as a pre-release gates it exactly the
      # way a draft did — except the installer is still downloadable for
      # testing, and nothing sits waiting on a human.
      #
      # A plain `desktop-v1.2.3` tag ships to every café. Anything else — an
      # `-rc1` suffix, or a manual workflow_dispatch run with no tag behind
      # it — is published as a pre-release and no café picks it up.
      - name: Decide whether this build ships to cafés
        id: channel
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # Builds, signs the updater artifacts, and creates/updates one published
      # release with the Windows installer and latest.json.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseName: 'KhaoPiyo Desktop __VERSION__'
          releaseBody: |
            Download the `.msi` below and run it.

            Existing installs update themselves the next time they are opened —
            no need to download anything.
          releaseDraft: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
          includeUpdaterJson: true
